<!doctype html>
<!--
  Source for images/og-preview.png (1200×630 link-preview image).
  To regenerate, serve the repo root (python3 -m http.server), open
  http://localhost:8000/tools/og-image.html at a 1200×630 viewport, and
  screenshot the page. Not linked from the site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mel’s Keebs preview image</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    gap: 36px;
    background:
      radial-gradient(ellipse 70% 420px at 50% -120px, var(--glow), transparent),
      var(--bg);
  }
  h1 { font-size: 64px; line-height: 1; font-weight: 500; letter-spacing: 0.01em; }
  p { margin: 14px 0 0; font-size: 26px; color: var(--muted); }
  .photo {
    flex: 1;
    min-height: 0;
    border: 2px solid var(--border-strong);
    border-radius: 18px;
    overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div>
    <h1>Mel’s Keebs</h1>
    <p>Mechanical keyboard builds: cases, plates, switches, and keycaps.</p>
  </div>
  <div class="photo"><img src="../images/kb-10-IMG_1375.jpg" alt=""></div>
</body>
</html>
